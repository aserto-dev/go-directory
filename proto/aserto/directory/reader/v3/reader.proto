    // relation instance (data)
    aserto.directory.common.v3.Relation relation = 8 [
      json_name = "relation",
      deprecated = false
    ];
    // object and/or relation stats (no data)
    google.protobuf.Struct stats = 16 [
      json_name = "stats",
      deprecated = false
    ];
  }
}

enum Option {
  // nothing selected (default initialization value)
  OPTION_UNKNOWN = 0x0;
  // manifest
  OPTION_SCHEMA_MANIFEST = 0x1;
  // model
  OPTION_SCHEMA_MODEL = 0x2;
  // schema instance OPTION_SCHEMA_MANIFEST | OPTION_SCHEMA_MODEL
  OPTION_SCHEMA = 0x3;
  // object instances
  OPTION_DATA_OBJECTS = 0x8;
  // relation instances
  OPTION_DATA_RELATIONS = 0x10;
  // all data = OPTION_DATA_OBJECTS | OPTION_DATA_RELATIONS
  OPTION_DATA = 0x18;
  // stats
  OPTION_STATS = 0x40;
}

