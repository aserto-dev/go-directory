syntax = "proto3";

package aserto.directory.reader.v3;

import "aserto/directory/common/v3/common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv3/options/annotations.proto";

option go_package = "github.com/aserto-dev/go-directory/aserto/directory/reader/v3;reader";
option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_document) = {
  info: {
    title: "Topaz Directory Service"
    // summary: ""
    // description: ""
    // terms_of_service: ""
    contact: {
      name: "Topaz Authorization Project"
      url: "https://github.com/aserto-dev/go-directory"
      email: "support@aserto.com"
    }
    license: {
      name: "Apache 2.0 License"
      url: "https://github.com/aserto-dev/go-directory/blob/main/LICENSE"
    }
    version: "3.1"
    // extensions: {}
  }

  servers: [
    {
      url: "{{.Scheme}}://{{.Host}}"
      description: "Topaz Directory service"
    }
  ]

  tags: [
    {name: "directory"},
    {name: "manifest"},
    {name: "model"},
    {name: "object"},
    {name: "relation"},
    {name: "get"},
    {name: "list"},
    {name: "set"},
    {name: "graph"},
    {name: "delete"},
    {name: "check"},
    {name: "checks"}
  ]

  external_docs: {
    description: "Topaz Directory API Reference."
    url: "https://github.com/aserto-dev/go-directory/blob/main/html/index.html"
  }

  // extensions: {}
};

// Directory Reader Service
service Reader {
  // get manifest
  rpc GetManifest(GetManifestRequest) returns (GetManifestResponse) {
    option (google.api.http) = {get: "/api/v3/directory/manifest"};
    option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_operation) = {
      tags: [
        "directory",
        "manifest",
        "get"
      ]
      summary: "Get manifest"
      description: "Returns directory manifest."
      // external_docs: {}
      operation_id: "directory.model.v3.manifest.get"
      deprecated: false
      // servers: {}
      // extensions: {}
    };
  }

  // get model
  rpc GetModel(GetModelRequest) returns (GetModelResponse) {
    option (google.api.http) = {get: "/api/v3/directory/model"};
    option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_operation) = {
      tags: [
        "directory",
        "model",
        "get"
      ]
      summary: "Get model"
      description: "Returns directory model."
      // external_docs: {}
      operation_id: "directory.model.v3.model.get"
      deprecated: false
      // servers: {}
      // extensions: {}
    };
  }

  // get object
  rpc GetObject(GetObjectRequest) returns (GetObjectResponse) {
    option (google.api.http) = {get: "/api/v3/directory/object/{object_type}/{object_id}"};
    option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_operation) = {
      tags: [
        "directory",
        "object",
        "get"
      ]
      summary: "Get object instance"
      description: "Returns single object instance, optionally with relations."
      // external_docs: {}
      operation_id: "directory.reader.v3.object.get"
      deprecated: false
      // servers: {}
      // extensions: {}
    };
  }

  // get multiple objects (deprecated, replaced by reader batch)
  rpc GetObjectMany(GetObjectManyRequest) returns (GetObjectManyResponse) {
    option deprecated = true;
  }

  // get objects (deprecated, replaced by list objects)
  rpc GetObjects(GetObjectsRequest) returns (GetObjectsResponse) {
    option deprecated = true;
  }

  // list objects
  rpc ListObjects(ListObjectsRequest) returns (ListObjectsResponse) {
    option (google.api.http) = {get: "/api/v3/directory/objects"};
    option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_operation) = {
      tags: [
        "directory",
        "object",
        "list"
      ]
      summary: "List object instances"
      description: "Returns list of object instances."
      // external_docs: {}
      operation_id: "directory.reader.v3.objects.list"
      deprecated: false
      // servers: {}
      // extensions: {}
    };
  }

  // get relation
  rpc GetRelation(GetRelationRequest) returns (GetRelationResponse) {
    option (google.api.http) = {get: "/api/v3/directory/relation"};
    option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_operation) = {
      tags: [
        "directory",
        "relation",
        "get"
      ]
      summary: "Get relation instance"
      description: "Returns single relation instance, optionally with objects."
      // external_docs: {}
      operation_id: "directory.reader.v3.relation.get"
      deprecated: false
      // servers: {}
      // extensions: {}
    };
  }

  // get relations (deprecated replaced by list relations)
  rpc GetRelations(GetRelationsRequest) returns (GetRelationsResponse) {
    option deprecated = true;
  }

  // list relations
  rpc ListRelations(ListRelationsRequest) returns (ListRelationsResponse) {
    option (google.api.http) = {get: "/api/v3/directory/relations"};
    option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_operation) = {
      tags: [
        "directory",
        "relation",
        "list"
      ]
      summary: "List relations instances"
      description: "Returns list of relation instances."
      // external_docs: {}
      operation_id: "directory.reader.v3.relations.list"
      deprecated: false
      // servers: {}
      // extensions: {}
    };
  }

  // check if subject has relation or permission with object
  rpc Check(CheckRequest) returns (CheckResponse) {
    option (google.api.http) = {
      post: "/api/v3/directory/check"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_operation) = {
      tags: [
        "directory",
        "relation",
        "check"
      ]
      summary: "Check"
      description: "Returns check outcome."
      // external_docs: {}
      operation_id: "directory.reader.v3.check"
      deprecated: false
      // servers: {}
      // extensions: {}
    };
  }

  // checks validates a set of check requests in a single roundtrip
  rpc Checks(ChecksRequest) returns (ChecksResponse) {
    option (google.api.http) = {
      post: "/api/v3/directory/checks"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_operation) = {
      tags: [
        "directory",
        "relation",
        "checks"
      ]
      summary: "Checks"
      description: "Returns multiple check outcomes."
      // external_docs: {}
      operation_id: "directory.reader.v3.checks"
      deprecated: false
      // servers: {}
      // extensions: {}
    };
  }

  // check permission (deprecated, use the check method)
  // Deprecated: use directory.reader.v3.Check()
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse) {
    option deprecated = true;
  }

  // check relation (deprecated, use the check method)
  // Deprecated: use directory.reader.v3.Check()
  rpc CheckRelation(CheckRelationRequest) returns (CheckRelationResponse) {
    option deprecated = true;
  }

  // get object relationship graph
  rpc GetGraph(GetGraphRequest) returns (GetGraphResponse) {
    option (google.api.http) = {get: "/api/v3/directory/graph/{object_type}/{relation}/{subject_type}"};
    option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_operation) = {
      tags: [
        "directory",
        "relation",
        "graph"
      ]
      summary: "Get graph"
      description: "Returns object graph from anchor to subject or object."
      // external_docs: {}
      operation_id: "directory.reader.v3.graph"
      deprecated: false
      // servers: {}
      // extensions: {}
    };
  }

  // export objects and relations as a stream
  rpc Export(ExportRequest) returns (stream ExportResponse) {}

  // batch reader requests
  rpc Batch(BatchRequest) returns (BatchResponse) {}
}

message GetManifestRequest {
  reserved 1;
  reserved "manifest_id";

  // empty request
  google.protobuf.Empty empty = 2 [
    json_name = "empty",
    deprecated = false
  ];
}

