message GetGraphRequest {
  reserved 1, 2;
  reserved "anchor_type", "anchor_id";

  // object type identifier
  string object_type = 3 [
    json_name = "object_type",
    (google.api.field_behavior) = REQUIRED,
    deprecated = false
  ];
  // object instance identifier (optional)
  string object_id = 4 [
    json_name = "object_id",
